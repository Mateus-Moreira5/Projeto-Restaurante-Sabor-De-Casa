<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Admin - Sabor de Casa</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>Área do Chef</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="cardapio.html">Cardápio</a>
            <a href="institucional.html">Nossa História</a>
        </nav>
    </header>
    <main>
        <div id="tela-login" style="display: none;">
            <h2>Login</h2>
            <form id="form-login">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>
                <p id="erro-login" style="color:red;display:none;">Credenciais inválidas.</p>
                <button type="submit">Entrar</button>
            </form>
        </div>

        <div id="tela-admin" style="display: none;">
            <h2>Painel</h2>
            <button id="btn-sair">Sair</button>
            <section>
                <h3>Gerenciar Pratos</h3>
                <button id="btn-novo-prato">Adicionar Novo Prato</button>
                <div id="lista-pratos-admin"></div>
            </section>
            <section>
                <h3>Pedidos Recentes</h3>
                <div id="lista-pedidos"></div>
            </section>
            <section>
                <h3>Formulários de Pedido</h3>
                <div id="lista-formularios"></div>
            </section>
        </div>

        <div id="modal-prato" style="display:none;">
            <div class="modal-content">
                <span class="fechar">&times;</span>
                <h3 id="modal-titulo"></h3>
                <form id="form-prato">
                    <input type="hidden" id="prato-id">
                    <label for="nomePrato">Nome *</label>
                    <input type="text" id="nomePrato" required maxlength="30">
                    <label for="descricao">Descrição</label>
                    <textarea id="descricao"></textarea>
                    <label for="infoIngrediente">Info Ingredientes *</label>
                    <input type="text" id="infoIngrediente" required>
                    <label for="acompanhamento">Acompanhamentos *</label>
                    <input type="text" id="acompanhamento" required>
                    <label for="urlImagem">URL Imagem</label>
                    <input type="url" id="urlImagem">
                    <label for="preco">Preço (R$) *</label>
                    <input type="number" id="preco" step="0.01" min="0" required>
                    <label for="disponivel">Disponível</label>
                    <input type="checkbox" id="disponivel" checked>
                    <button type="submit">Salvar</button>
                </form>
            </div>
        </div>
    </main>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
