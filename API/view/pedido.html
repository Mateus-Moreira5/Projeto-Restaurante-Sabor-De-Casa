<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finalizar Pedido - Sabor de Casa</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <header>
        <h1>Finalizar Pedido</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="cardapio.html">Cardápio</a>
            <a href="institucional.html">Nossa História</a>
            <a href="carrinho.html">Carrinho</a>
        </nav>
    </header>
    <main>
        <h2>Seu Pedido</h2>
        <div id="resumo-itens"></div>
        <form id="form-pedido">
            <label for="nome">Nome *</label>
            <input type="text" id="nome" required>

            <label for="telefone">Telefone *</label>
            <input type="tel" id="telefone" required>

            <label for="pagamento">Método de Pagamento *</label>
            <select id="pagamento" required>
                <option value="">Selecione</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Cartão">Cartão</option>
                <option value="Pix">Pix</option>
            </select>

            <label>Tipo de Entrega *</label>
            <div class="opcoes-entrega">
                <label><input type="radio" name="tipoEntrega" value="retirada" checked> Retirada no local</label>
                <label><input type="radio" name="tipoEntrega" value="delivery"> Delivery</label>
            </div>

            <div id="campos-endereco" style="display: none;">
                <label for="cep">CEP</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="cep" maxlength="9" placeholder="00000-000">
                    <button type="button" id="buscar-cep">Buscar</button>
                </div>
                <label for="logradouro">Logradouro</label>
                <input type="text" id="logradouro" readonly>
                <label for="numero">Número *</label>
                <input type="text" id="numero" required>
                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" readonly>
                <label for="complemento">Complemento</label>
                <input type="text" id="complemento">
            </div>

            <button type="submit">Enviar Pedido</button>
        </form>
    </main>
    <script src="js/nav-mobile.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pedido.js"></script>
</body>
</html>
